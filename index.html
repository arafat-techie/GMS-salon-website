<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>GMS — Glamorous Makup Studio</title>
    <meta
      name="description"
      content="Glamorous Makup Studio is a luxury beauty salon for hair, colour, bridal makeup, skin, nails and spa. Book your appointment online."
    />
    <meta property="og:title" content="GMS — Where beauty becomes art" />
    <meta
      property="og:description"
      content="Luxury beauty experiences crafted especially for you."
    />
    <meta property="og:type" content="website" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "GMS",
        "description": "Luxury hair, makeup, skin, nails and spa.",
        "telephone": "+917541927596",
        "openingHours": "Mo-Su 10:00-20:00",
        "priceRange": "₹₹₹"
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f1e8;
        --bg2: #efe3d2;
        --card: #fffaf3;
        --ink: #3a1f26;
        --mute: #6f5a5c;
        --rose: #c58f94;
        --blush: #e8c9c4;
        --wine: #5e1f2f;
        --gold: #9a7840;
        --line: rgba(94, 31, 47, 0.16);
        --onwine: #f7f1e8;
        --sh: 0 18px 40px -22px rgba(94, 31, 47, 0.35);
        --ps: 0px;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: "Figtree", system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d1014;
          --bg2: #27161b;
          --card: #2f1c22;
          --ink: #f3e6dc;
          --mute: #c9b3ae;
          --rose: #d9a0a6;
          --blush: #5a3038;
          --wine: #e8b9bc;
          --gold: #d2ad72;
          --line: rgba(243, 230, 220, 0.16);
          --onwine: #1d1014;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d1014;
        --bg2: #27161b;
        --card: #2f1c22;
        --ink: #f3e6dc;
        --mute: #c9b3ae;
        --rose: #d9a0a6;
        --blush: #5a3038;
        --wine: #e8b9bc;
        --gold: #d2ad72;
        --line: rgba(243, 230, 220, 0.16);
        --onwine: #1d1014;
      }
      html {
        height: 100%;
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.65 var(--sans);
        overflow-x: hidden;
        min-height: 100%;
      }
      h1,
      h2,
      h3 {
        font-family: var(--serif);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(2.8rem, 9vw, 6.6rem);
      }
      h2 {
        font-size: clamp(2rem, 5vw, 3.6rem);
      }
      h3 {
        font-size: 1.5rem;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img,
      svg {
        max-width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
      .wrap {
        max-width: 1200px;
        margin: auto;
        padding: 0 22px;
      }
      .sec {
        padding: clamp(60px, 9vw, 120px) 0;
      }
      .alt {
        background: var(--bg2);
      }
      .lead {
        color: var(--mute);
        max-width: 56ch;
        font-family: var(--serif);
        font-size: 1.3rem;
        line-height: 1.5;
      }
      .sh {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 44px;
      }
      .btn {
        display: inline-block;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--wine);
        background: var(--wine);
        color: var(--onwine);
        padding: 14px 28px;
        border-radius: 99px;
        font: 500 0.95rem var(--sans);
        cursor: pointer;
        transition:
          background 0.4s,
          color 0.4s,
          transform 0.25s;
      }
      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 30%,
          rgba(255, 255, 255, 0.35),
          transparent 70%
        );
        transform: translateX(-120%);
        transition: transform 0.7s;
      }
      .btn:hover::after {
        transform: translateX(120%);
      }
      .btn.ghost {
        background: transparent;
        color: var(--wine);
      }
      .btn.ghost:hover {
        background: var(--wine);
        color: var(--onwine);
      }
      .btn.sm {
        padding: 9px 18px;
        font-size: 0.85rem;
      }
      .art {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .art svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.5;
      }
      .skel {
        background: linear-gradient(
          90deg,
          var(--bg2),
          var(--blush),
          var(--bg2)
        );
        background-size: 200%;
        animation: sk 1.4s infinite;
      }
      @keyframes sk {
        to {
          background-position: -200%;
        }
      }
      /* loader */
      #ld {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: var(--wine);
        color: #f7f1e8;
        display: grid;
        place-content: center;
        text-align: center;
        transition:
          opacity 0.8s,
          visibility 0.8s;
      }
      #ld.off {
        opacity: 0;
        visibility: hidden;
      }
      #ld b {
        font: 500 clamp(3rem, 12vw, 6rem)/1 var(--serif);
        letter-spacing: 0.3em;
        margin-right: -0.3em;
        animation: rv 1.2s both;
      }
      #ld p {
        letter-spacing: 0.3em;
        font-size: 0.8rem;
        margin-top: 14px;
        opacity: 0.8;
      }
      #ld i {
        display: block;
        height: 1px;
        width: 180px;
        margin: 26px auto 0;
        background: #d2ad72;
        transform: scaleX(0);
        transform-origin: left;
        animation: ln 1.6s 0.2s forwards;
      }
      @keyframes rv {
        from {
          opacity: 0;
          filter: blur(10px);
          letter-spacing: 0.8em;
        }
      }
      @keyframes ln {
        to {
          transform: scaleX(1);
        }
      }
      #pg {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--gold);
        z-index: 60;
        width: 0;
      }
      /* nav */
      nav {
        position: fixed;
        top: var(--ps);
        left: 0;
        right: 0;
        z-index: 50;
        transition:
          background 0.4s,
          box-shadow 0.4s,
          padding 0.4s;
        padding: 20px 0;
        color: var(--ink);
      }
      nav.hero:not(.sc) {
        color: #fff8f0;
      }
      nav::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
        opacity: 0;
        transition: opacity 0.4s;
      }
      nav.sc::before,
      nav.solid::before {
        opacity: 1;
      }
      nav.sc,
      nav.solid {
        padding: 12px 0;
        box-shadow: 0 1px 0 var(--line);
      }
      nav .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font: 600 1.7rem var(--serif);
        letter-spacing: 0.28em;
      }
      .links {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .links a {
        position: relative;
        font-size: 0.92rem;
      }
      .links a:not(.btn)::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transition: transform 0.35s;
      }
      .links a.on::after,
      .links a:hover::after {
        transform: scaleX(1);
      }
      .links .btn {
        color: var(--onwine);
      }
      nav.hero:not(.sc) .links .btn {
        background: #f7f1e8;
        color: #5e1f2f;
        border-color: #f7f1e8;
      }
      .bg {
        display: none;
        width: 44px;
        height: 44px;
        background: none;
        border: 0;
        cursor: pointer;
        color: inherit;
        position: relative;
        z-index: 70;
      }
      .bg span {
        position: absolute;
        left: 10px;
        right: 10px;
        height: 2px;
        background: currentColor;
        transition: 0.35s;
      }
      .bg span:nth-child(1) {
        top: 16px;
      }
      .bg span:nth-child(2) {
        top: 26px;
      }
      .bg.x span:nth-child(1) {
        top: 21px;
        transform: rotate(45deg);
      }
      .bg.x span:nth-child(2) {
        top: 21px;
        transform: rotate(-45deg);
      }
      @media (max-width: 900px) {
        .bg {
          display: block;
        }
        .links {
          position: fixed;
          inset: 0;
          background: var(--wine);
          color: #f7f1e8;
          flex-direction: column;
          justify-content: center;
          gap: 22px;
          clip-path: circle(0 at 92% 6%);
          transition: clip-path 0.7s;
          z-index: 65;
        }
        .links.o {
          clip-path: circle(150% at 92% 6%);
        }
        .links a {
          font: 500 2.2rem var(--serif);
        }
        .links .btn {
          font: 500 1rem var(--sans);
        }
        nav.hero:not(.sc) .bg.x,
        .bg.x {
          color: #f7f1e8;
        }
      }
      main {
        min-height: 80vh;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      main.out {
        opacity: 0;
        transform: translateY(14px);
      }
      /* hero */
      .hero-s {
        position: relative;
        min-height: 100svh;
        display: grid;
        align-items: end;
        overflow: hidden;
        color: #fff8f0;
        background: #3a1420;
      }
      .hl {
        position: absolute;
        inset: -6%;
        will-change: transform;
      }
      .hl .art {
        border-radius: 0;
      }
      .hero-s::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(40, 12, 20, 0.78),
          rgba(40, 12, 20, 0.1) 60%
        );
      }
      .hp {
        position: absolute;
        right: 7%;
        top: 20%;
        width: min(28vw, 300px);
        aspect-ratio: 3/4;
        border-radius: 200px 200px 16px 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.4);
        z-index: 1;
        will-change: transform;
      }
      .hp.b {
        right: 22%;
        top: 46%;
        width: min(16vw, 170px);
        border-radius: 99px;
        animation: fl 7s ease-in-out infinite;
      }
      @keyframes fl {
        50% {
          translate: 0 -16px;
        }
      }
      .pt {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e9cf9c;
        opacity: 0.6;
        z-index: 1;
        animation: fl 6s ease-in-out infinite;
      }
      .hc {
        position: relative;
        z-index: 2;
        padding: 0 0 clamp(50px, 8vw, 100px);
      }
      .hc h1 span {
        display: block;
        overflow: hidden;
      }
      .hc h1 em {
        display: block;
        font-style: italic;
        animation: up 1.2s 1.6s both;
        color: #e9cf9c;
      }
      .hc h1 span b {
        display: block;
        font-weight: 500;
        animation: up 1.2s 1.4s both;
      }
      @keyframes up {
        from {
          transform: translateY(105%);
          opacity: 0;
        }
      }
      .hc p {
        margin: 22px 0 30px;
        font: 1.4rem var(--serif);
        max-width: 34ch;
        animation: up 1.2s 1.9s both;
      }
      .hc .btn.ghost {
        color: #fff8f0;
        border-color: #fff8f0;
      }
      .hc .btn:first-of-type {
        background: #f7f1e8;
        color: #5e1f2f;
        border-color: #f7f1e8;
      }
      .row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      /* grids */
      .g3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 26px;
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: clamp(30px, 6vw, 80px);
        align-items: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px 22px 6px 6px;
        overflow: hidden;
        transition:
          transform 0.5s,
          box-shadow 0.5s,
          border-color 0.5s;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: var(--sh);
        border-color: var(--gold);
      }
      .card .im {
        aspect-ratio: 4/5;
        overflow: hidden;
      }
      .card .im .art {
        transition: transform 1s;
      }
      .card:hover .im .art {
        transform: scale(1.08);
      }
      .card .bd {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .card .bd p {
        color: var(--mute);
        font-size: 0.92rem;
        flex: 1;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
      }
      .chips {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 34px;
      }
      .chip {
        border: 1px solid var(--line);
        background: none;
        color: var(--ink);
        border-radius: 99px;
        padding: 9px 20px;
        cursor: pointer;
        font: 500 0.9rem var(--sans);
        transition: 0.3s;
      }
      .chip.on,
      .chip:hover {
        background: var(--wine);
        color: var(--onwine);
        border-color: var(--wine);
      }
      .fade {
        animation: fi 0.6s both;
      }
      @keyframes fi {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .ph {
        padding: 150px 0 50px;
        background: var(--bg2);
      }
      .ph p {
        margin-top: 16px;
      }
      .arch {
        border-radius: 300px 300px 12px 12px;
        overflow: hidden;
        aspect-ratio: 3/4;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        text-align: center;
      }
      .stats b {
        display: block;
        font: 500 clamp(2.6rem, 6vw, 4.4rem)/1 var(--serif);
        color: var(--wine);
      }
      .tl {
        border-left: 1px solid var(--gold);
        padding-left: 28px;
        display: grid;
        gap: 30px;
        max-width: 640px;
      }
      .tl div {
        position: relative;
      }
      .tl div::before {
        content: "";
        position: absolute;
        left: -34px;
        top: 8px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--gold);
      }
      .tl b {
        font: 500 1.6rem var(--serif);
        color: var(--wine);
      }
      .why {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        border-top: 1px solid var(--line);
      }
      .why div {
        padding: 30px 24px 30px 0;
        border-bottom: 1px solid var(--line);
      }
      .why h3 {
        margin-bottom: 8px;
      }
      .why p {
        color: var(--mute);
        font-size: 0.95rem;
      }
      /* gallery */
      .mas {
        columns: 3 240px;
        column-gap: 16px;
      }
      .gi {
        break-inside: avoid;
        margin-bottom: 16px;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        border: 0;
        padding: 0;
        display: block;
        width: 100%;
        background: none;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 1s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .gi.in {
        clip-path: inset(0);
      }
      .gi .art {
        height: 100%;
        transition: transform 1s;
      }
      .gi:hover .art {
        transform: scale(1.07);
      }
      .gi span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 30px 14px 12px;
        color: #fff8f0;
        font: 500 1.1rem var(--serif);
        text-align: left;
        background: linear-gradient(0deg, rgba(40, 12, 20, 0.7), transparent);
        opacity: 0;
        transition: 0.4s;
      }
      .gi:hover span,
      .gi:focus-visible span {
        opacity: 1;
      }
      #lb {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(25, 8, 13, 0.94);
        display: grid;
        place-items: center;
        opacity: 0;
        visibility: hidden;
        transition: 0.45s;
        color: #fff8f0;
      }
      #lb.o {
        opacity: 1;
        visibility: visible;
      }
      #lb .st {
        width: min(86vw, 760px);
        height: min(70vh, 760px);
        border-radius: 16px;
        overflow: hidden;
        transform: scale(0.9);
        transition:
          transform 0.5s,
          opacity 0.3s;
      }
      #lb.o .st {
        transform: scale(1);
      }
      #lb .cp {
        position: absolute;
        bottom: 4vh;
        text-align: center;
        left: 0;
        right: 0;
        font: 1.4rem var(--serif);
      }
      #lb .cp small {
        display: block;
        font: 0.8rem var(--sans);
        opacity: 0.7;
        letter-spacing: 0.1em;
      }
      .lbb {
        position: absolute;
        background: rgba(255, 255, 255, 0.12);
        border: 0;
        color: #fff;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 1.4rem;
        cursor: pointer;
        transition: 0.3s;
      }
      .lbb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      /* before after */
      .ba {
        position: relative;
        aspect-ratio: 4/5;
        border-radius: 18px;
        overflow: hidden;
        touch-action: pan-y;
        --p: 50%;
        user-select: none;
      }
      .ba .top {
        position: absolute;
        inset: 0;
        clip-path: inset(0 calc(100% - var(--p)) 0 0);
      }
      .ba .hd {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--p);
        width: 2px;
        background: #fff;
        transform: translateX(-1px);
        pointer-events: none;
      }
      .ba .hd::after {
        content: "↔";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        margin: -21px;
        border-radius: 50%;
        background: #fff;
        color: #5e1f2f;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      .ba input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: ew-resize;
        margin: 0;
        touch-action: pan-y;
      }
      .ba em {
        position: absolute;
        bottom: 14px;
        padding: 4px 12px;
        border-radius: 99px;
        background: rgba(40, 12, 20, 0.6);
        color: #fff;
        font: 600 0.72rem var(--sans);
        letter-spacing: 0.1em;
        z-index: 2;
        font-style: normal;
      }
      /* team, offers */
      .tm .im {
        aspect-ratio: 3/4;
      }
      .tm .bd {
        text-align: center;
      }
      .tm .soc {
        display: flex;
        gap: 12px;
        justify-content: center;
        font-size: 0.85rem;
        color: var(--gold);
      }
      .of {
        position: relative;
      }
      .badge {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 2;
        background: var(--wine);
        color: var(--onwine);
        font: 600 0.72rem var(--sans);
        padding: 6px 12px;
        border-radius: 99px;
        animation: pl 2.4s infinite;
      }
      @keyframes pl {
        50% {
          transform: scale(1.07);
        }
      }
      .pr s {
        color: var(--mute);
      }
      .pr b {
        font: 500 2rem var(--serif);
        color: var(--wine);
        margin: 0 8px;
      }
      .pr i {
        color: var(--gold);
        font-style: normal;
        font-weight: 600;
      }
      /* testimonials */
      .ts {
        position: relative;
        overflow: hidden;
      }
      .tt {
        display: flex;
        transition: transform 0.7s cubic-bezier(0.6, 0, 0.2, 1);
      }
      .tq {
        min-width: 100%;
        padding: 0 4px;
        text-align: center;
      }
      .tq p {

          if (b) {
            const r = b.getBoundingClientRect();
            b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.18}px,${(e.clientY - r.top - r.height / 2) * 0.25}px)`;
          }
        },
        { passive: true },
      );
      addEventListener("mouseout", (e) => {
        const b = e.target.closest && e.target.closest(".btn");
        if (b) b.style.transform = "";
      });
      addEventListener("hashchange", route);
      route();
      addEventListener("load", () =>
        setTimeout(() => $("#ld").classList.add("off"), 1900),
      );
    </script>
  </body>
</html>
